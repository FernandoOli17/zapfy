name: zapai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapai
      POSTGRES_PASSWORD: zapai
      POSTGRES_DB: zapai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zapai -d zapai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zapai-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
